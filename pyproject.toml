[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "claim-evidence-benchmark"
version = "0.1.0"
description = "Transparent evidence retrieval baseline and challenge dataset"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.32,<2"]
[project.optional-dependencies]
test = ["pytest>=7,<10"]
[tool.setuptools.packages.find]
where = ["src"]
